<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="224" height="224" viewBox="0 0 160 160"
     fill="none" shape-rendering="geometricPrecision">
  <title>Seamless steel chain-link net</title>
  <desc>A transparent, repeatable metallic chain-link fence tile.</desc>

  <defs>
    <!-- Two crossing families of diagonal wire, extended past the tile edges. -->
    <path id="lattice" d="
      M -80 0 L 80 160
      M   0 0 L 160 160
      M  80 0 L 240 160
      M  80 0 L -80 160
      M 160 0 L   0 160
      M 240 0 L  80 160"/>

    <!-- Tiny openings prevent the underlying X from showing through each twist. -->
    <g id="hole">
      <ellipse cx="0" cy="0" rx="2.35" ry="5.5" transform="rotate(-45)"/>
    </g>
    <mask id="twist-cutouts" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="200">
      <rect x="-20" y="-20" width="200" height="200" fill="white"/>
      <g fill="black">
        <use xlink:href="#hole" x="0"   y="0"/>
        <use xlink:href="#hole" x="80"  y="0"/>
        <use xlink:href="#hole" x="160" y="0"/>
        <use xlink:href="#hole" x="40"  y="40"/>
        <use xlink:href="#hole" x="120" y="40"/>
        <use xlink:href="#hole" x="0"   y="80"/>
        <use xlink:href="#hole" x="80"  y="80"/>
        <use xlink:href="#hole" x="160" y="80"/>
        <use xlink:href="#hole" x="40"  y="120"/>
        <use xlink:href="#hole" x="120" y="120"/>
        <use xlink:href="#hole" x="0"   y="160"/>
        <use xlink:href="#hole" x="80"  y="160"/>
        <use xlink:href="#hole" x="160" y="160"/>
      </g>
    </mask>

    <!-- A compact woven twist used at every intersection. -->
    <g id="twist" transform="scale(.78)">
      <ellipse cx="0" cy="0" rx="5.4" ry="11.2" transform="rotate(-45)"
               stroke="#262a2c" stroke-width="6.1"/>
      <ellipse cx="0" cy="0" rx="5.4" ry="11.2" transform="rotate(-45)"
               stroke="#92989b" stroke-width="3.9"/>
      <ellipse cx="0" cy="0" rx="5.4" ry="11.2" transform="rotate(-45) translate(-1.15 -0.25)"
               stroke="#f0f2f2" stroke-width="1.05" opacity="0.95"/>

      <!-- The short bridge creates the characteristic over-under chain-link weave. -->
      <path d="M -8.2 8.2 L 8.2 -8.2" stroke="#25292b" stroke-width="6.1"
            stroke-linecap="round"/>
      <path d="M -8.2 8.2 L 8.2 -8.2" stroke="#989ea1" stroke-width="3.9"
            stroke-linecap="round"/>
      <path d="M -8.8 7.1 L 7.5 -9.2" stroke="#f2f4f4" stroke-width="1.05"
            stroke-linecap="round" opacity="0.95"/>
    </g>
  </defs>

  <!-- No rectangle is drawn: the background remains fully transparent. -->
  <g mask="url(#twist-cutouts)" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#lattice" stroke="#232729" stroke-width="6.1"/>
    <use xlink:href="#lattice" stroke="#90969a" stroke-width="3.9"/>
    <use xlink:href="#lattice" stroke="#555b5e" stroke-width="1.8"
         transform="translate(.9 .9)" opacity="0.9"/>
    <use xlink:href="#lattice" stroke="#eef0f0" stroke-width="1"
         transform="translate(-.8 -.8)" opacity="0.95"/>
  </g>

  <g>
    <use xlink:href="#twist" transform="translate(0 0)"/>
    <use xlink:href="#twist" transform="translate(80 0)"/>
    <use xlink:href="#twist" transform="translate(160 0)"/>
    <use xlink:href="#twist" transform="translate(40 40)"/>
    <use xlink:href="#twist" transform="translate(120 40)"/>
    <use xlink:href="#twist" transform="translate(0 80)"/>
    <use xlink:href="#twist" transform="translate(80 80)"/>
    <use xlink:href="#twist" transform="translate(160 80)"/>
    <use xlink:href="#twist" transform="translate(40 120)"/>
    <use xlink:href="#twist" transform="translate(120 120)"/>
    <use xlink:href="#twist" transform="translate(0 160)"/>
    <use xlink:href="#twist" transform="translate(80 160)"/>
    <use xlink:href="#twist" transform="translate(160 160)"/>
  </g>
</svg>
