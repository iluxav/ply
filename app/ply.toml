# plybox.sh — the ply website, running on ply (landing + /docs + /registry).
# Next.js standalone build; docs are baked at build time from ../docs.
#
#   npm run build          # → .next/standalone (+ static & public copied in)
#   ply build .
#   sudo ply run --publish 80:3000 --scale 2 plybox-web-0.1.0-linux-x64.img

[package]
name = "plybox-web"
version = "0.2.0"
entrypoint = ["node", ".next/standalone/server.js"]
include = [".next/standalone/"]
base = "debian@13"

[dependencies]
node = "24"

[env]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"

[ports]
web = 3000

[health]
port = 3000
grace = "15s"

[restart]
policy = "on-failure"

[sources]
default = "https://registry.plybox.sh/ply/{package}"
