[workspace]
resolver = "2"
members = ["ply-core", "ply-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/iluxa/ply"

[workspace.dependencies]
ply-core = { path = "ply-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
backhand = { version = "0.25", default-features = false, features = ["zstd"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
nix = { version = "0.31", features = ["sched", "mount", "signal", "hostname", "process", "fs", "ioctl", "user", "term"] }
caps = "0.5"
seccompiler = "0.5"
semver = { version = "1", features = ["serde"] }
walkdir = "2"
tempfile = "3"
tar = "0.4"
flate2 = "1"

[profile.dev]
debug = "line-tables-only"

# shipped binary: smallest + fastest to run (slow to build — that's fine)
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
