name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: ply-linux-x64
          - target: aarch64-unknown-linux-musl
            artifact: ply-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo install cross --locked
          fi
      - name: build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }} -p ply-cli
          else
            cargo build --release --target ${{ matrix.target }} -p ply-cli
          fi
          cp target/${{ matrix.target }}/release/ply ${{ matrix.artifact }}
      - name: test (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --workspace
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.artifact }}" --clobber
