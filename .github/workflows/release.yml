name: release
on:
  push:
    # v*.*.* not v*: the `v1` action tag is re-pointed on every action change
    # and would otherwise start a release that can only fail the version guard.
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: ply-linux-x64
          - target: aarch64-unknown-linux-musl
            artifact: ply-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - name: tag matches crate version
        run: |
          crate="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ply-cli") | .version')"
          test "$crate" = "${GITHUB_REF_NAME}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version ${crate} — bump [workspace.package] version before tagging"; exit 1; }
      - run: rustup target add ${{ matrix.target }}
      - name: install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo install cross --locked
          fi
      - name: build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }} -p ply-cli
          else
            cargo build --release --target ${{ matrix.target }} -p ply-cli
          fi
          cp target/${{ matrix.target }}/release/ply ${{ matrix.artifact }}
      - name: test (x64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --workspace
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.artifact }}" --clobber

  # `make release` creates the release as a DRAFT. A draft is not "latest" and
  # has no download URL, so `releases/latest/download/…` keeps resolving to the
  # previous good release while this one builds. Publishing here — after every
  # matrix leg has uploaded — closes the window where install.sh 404s.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          echo "published ${{ github.ref_name }} with:"
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
