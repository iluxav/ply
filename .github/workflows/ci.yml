name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: make check

  # The macOS seam gate (spec: "CI runs cargo check --target
  # aarch64-apple-darwin -p ply-cli on every push from the first task on").
  # Native on Apple Silicon runners, so no cross toolchain is needed.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin && rustup component add clippy
      - run: cargo check --target aarch64-apple-darwin -p ply-cli
      - run: cargo clippy --target aarch64-apple-darwin -p ply-cli -- -D warnings
      # …and the TEST code too. `-p ply-cli` alone compiles none of it, which
      # is how ply-core's tests came to reference the Linux-only
      # `runtime::ns` and broke `cargo test` on macOS entirely without any
      # gate noticing. The portable half of the VM backend — the spec-disk
      # codec, the switch's ARP/DNS/NAT logic — is unit-tested and must keep
      # compiling here. Does not RUN the tests: booting microVMs is
      # `make mac-test`, on a machine with Hypervisor.framework.
      - run: cargo check --workspace --all-targets --target aarch64-apple-darwin
