# plybox.sh — build the site (app/ + docs/) and publish it as a GitHub
# release in the `web-v*` stream. No secrets beyond GITHUB_TOKEN.
#
# Pull-based: CI never touches the droplet. The prod host runs a
# `plybox-web` deployment (github = "iluxav/ply", tag_prefix = "web-v")
# with the reconcile timer — it notices the new release and rolls itself
# within a minute. Nothing here can log into prod.
#
# `--latest=false` is load-bearing: the repo's `latest` marker belongs to
# the CLI's `v*` releases (install.sh depends on it).
#
# Topology: caddy (deploy/edge, a ply app) owns :443 and reverse-proxies to
# the app's published internal address. The edge is deployed by hand — it
# changes rarely and holds the TLS certs.
name: deploy-web
# Deploys are deliberate: `make release-web` dispatches this; a plain push
# ships nothing. (Path-triggered deploys raced releases — a pushed install.sh
# went live before the CLI release it depended on existed.)
on:
  workflow_dispatch:      # make release-web

# a push-trigger and a dispatched run must never roll the droplet
# concurrently — queue them instead
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: write   # gh release create

jobs:
  deploy:
    # x64: must match the droplet's arch — `ply build` builds for the host,
    # and npm's native modules follow the runner too. (The droplet is x64;
    # if it ever moves to arm64, change only this line.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      # The registry is append-only: a version's bytes never change, so
      # every publish needs a fresh one. The run number is the clock
      # (0.2.x was seeded by hand; CI owns 0.3.x — always newer).
      - name: stamp version
        run: sed -i "s/^version = \".*\"/version = \"0.3.${{ github.run_number }}\"/" app/ply.toml

      - name: build site (standalone)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: build image
        id: img
        uses: ./
        with:
          dir: "app"
          upload: "false"

      - name: publish web release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMG="${{ steps.img.outputs.image }}"
          V="0.3.${{ github.run_number }}"
          gh release create "web-v$V" "$IMG" --latest=false \
            --title "plybox.sh $V" \
            --notes "site image (web release stream — not a CLI release)"
          echo "published web-v$V — prod pulls it within its next reconcile beat"

      - name: verify prod converged
        run: |
          # The droplet's timer beats once a minute; through the edge, over
          # TLS. Serving is necessary; the site carries no version endpoint,
          # so serving + the release existing is what we can honestly check.
          for i in $(seq 1 40); do
            sleep 6
            curl -fsS -m 5 "https://plybox.sh/" -o /dev/null && exit 0
          done
          echo "::error::plybox.sh stopped serving after the publish"
          exit 1
