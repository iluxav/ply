# plybox.sh — build the site (app/ + docs/) and publish it to the registry.
# Secrets: CLOUDFLARE_API_TOKEN (R2 write), CLOUDFLARE_ACCOUNT_ID.
#
# Pull-based: CI never touches the droplet. The prod host runs a
# `plybox-web` deployment (app = "plybox-web") with the reconcile timer —
# it notices the new registry version and rolls itself within a minute.
# CI holds registry credentials only; nothing here can log into prod.
#
# Topology: caddy (deploy/edge, a ply app) owns :443 and reverse-proxies to
# the app's published internal address. The edge is deployed by hand — it
# changes rarely and holds the TLS certs.
name: deploy-web
# Deploys are deliberate: `make release-web` dispatches this; a plain push
# ships nothing. (Path-triggered deploys raced releases — a pushed install.sh
# went live before the CLI release it depended on existed.)
on:
  workflow_dispatch:      # make release-web

# a push-trigger and a dispatched run must never roll the droplet
# concurrently — queue them instead
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    # x64: must match the droplet's arch — `ply build` builds for the host,
    # and npm's native modules follow the runner too. (The droplet is x64;
    # if it ever moves to arm64, change only this line.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      # The registry is append-only: a version's bytes never change, so
      # every publish needs a fresh one. The run number is the clock
      # (0.2.x was seeded by hand; CI owns 0.3.x — always newer).
      - name: stamp version
        run: sed -i "s/^version = \".*\"/version = \"0.3.${{ github.run_number }}\"/" app/ply.toml

      - name: build site (standalone)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: build image
        id: img
        uses: ./
        with:
          dir: "app"
          upload: "false"

      - name: publish to registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          IMG="${{ steps.img.outputs.image }}"
          BASE=$(basename "$IMG")
          npx wrangler r2 object put "ply-registry-deb/apps/plybox-web/$BASE" \
            --file "$IMG" --remote \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type application/octet-stream
          # append to the version index (newest-matching resolution reads this)
          curl -fsSL https://registry.plybox.sh/apps/plybox-web/index.json -o index.json || echo "[]" > index.json
          node -e "const fs=require('fs');const i=JSON.parse(fs.readFileSync('index.json'));const b=process.argv[1];if(!i.includes(b))i.push(b);fs.writeFileSync('index.json',JSON.stringify(i))" "$BASE"
          npx wrangler r2 object put "ply-registry-deb/apps/plybox-web/index.json" \
            --file index.json --remote \
            --cache-control "public, max-age=60" --content-type application/json
          echo "published $BASE — prod pulls it within its next reconcile beat"

      - name: verify from outside
        run: |
          # The droplet's timer beats once a minute; a build + roll follows.
          # Through the edge, over TLS — the app has no public port of its own.
          BASE=$(basename "${{ steps.img.outputs.image }}")
          WANT="0.3.${{ github.run_number }}"
          for i in $(seq 1 40); do
            sleep 6
            if curl -fsS -m 5 "https://plybox.sh/" -o /dev/null; then
              # serving is necessary; matching version is the real proof —
              # but the site does not expose its version, so serving + the
              # registry carrying $WANT is what we can honestly check.
              curl -fsS "https://registry.plybox.sh/apps/plybox-web/index.json" | grep -q "$WANT" && exit 0
            fi
          done
          echo "::error::plybox.sh did not converge on $WANT"
          exit 1
