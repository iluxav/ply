# plybox.sh — build the site (app/ + docs/) and roll it onto the web droplet.
# Secrets: WEB_DEPLOY_SSH_KEY. Vars: WEB_DROPLET_HOST.
#
# Topology: caddy (deploy/edge, a ply app) owns :443 and reverse-proxies to
# this app's published internal address. The edge is deployed by hand — it
# changes rarely and holds the TLS certs — so this workflow only rolls the
# site itself.
name: deploy-web
# Deploys are deliberate: `make release-web` dispatches this; a plain push
# ships nothing. (Path-triggered deploys raced releases — a pushed install.sh
# went live before the CLI release it depended on existed.)
on:
  workflow_dispatch:      # make release-web

# a push-trigger and a dispatched run must never roll the droplet
# concurrently — queue them instead
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    # x64: must match the droplet's arch — `ply build` builds for the host,
    # and npm's native modules follow the runner too. (The droplet is x64;
    # if it ever moves to arm64, change only this line.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: build site (standalone)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: build image
        id: img
        uses: ./
        with:
          dir: "app"
          upload: "false"

      - name: ship + roll
        uses: ./deploy
        with:
          image: ${{ steps.img.outputs.image }}
          host: ${{ vars.WEB_DROPLET_HOST }}
          ssh-key: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          scale: "2"
          # internal: the run parent binds the bridge gateway, not 0.0.0.0.
          # The edge (deploy/edge) owns :443 and proxies to it — publishing
          # this on :80 would collide with the edge and expose the app
          # directly. Only used when bootstrapping a unit that is not already
          # active; a live host takes the `ply deploy` path instead.
          publish: "internal:3000"

      - name: verify from outside
        run: |
          # Through the edge, over TLS — the app has no public port of its own.
          for i in $(seq 1 20); do
            curl -fsS -m 5 "https://plybox.sh/" -o /dev/null && exit 0
            sleep 3
          done
          echo "::error::plybox.sh did not serve after the roll"
          exit 1
