# postgres — first-class runnable image for `ply run postgres@17`.
# Speaks the docker-library env contract, so existing muscle memory works:
#
#   ply run postgres@17 -e POSTGRES_PASSWORD=dev -e POSTGRES_DB=todos
#
#   POSTGRES_USER      superuser name            (default: postgres)
#   POSTGRES_PASSWORD  set → scram auth; unset → trust (dev mode)
#   POSTGRES_DB        extra database created on first boot
#   PGPORT             listen port               (default: 5432)
#   POSTGRES_LISTEN    listen_addresses          (default: *; use 127.0.0.1
#                      to keep a rootless instance off the LAN)
#
# Data persists in the `data` volume; first boot runs initdb.

[package]
name = "postgres"
version = "17.10.0"
user = "postgres:70:70"
entrypoint = ["/bin/sh", "-c", """
set -e
PGBIN=/opt/postgresql17-17.10.0/usr/lib/postgresql/17/bin
PGDATA=/var/lib/postgresql/data
if [ ! -s "$PGDATA/PG_VERSION" ]; then
  echo "postgres: initializing $PGDATA"
  if [ -n "$POSTGRES_PASSWORD" ]; then
    printf '%s\\n' "$POSTGRES_PASSWORD" > /tmp/.pgpw
    $PGBIN/initdb -D "$PGDATA" --auth=scram-sha-256 --username="${POSTGRES_USER:-postgres}" --pwfile=/tmp/.pgpw --locale=C.UTF-8
    rm -f /tmp/.pgpw
    echo "host all all all scram-sha-256" >> "$PGDATA/pg_hba.conf"
  else
    echo "postgres: WARNING: no POSTGRES_PASSWORD — trust auth (dev only)"
    $PGBIN/initdb -D "$PGDATA" --auth=trust --username="${POSTGRES_USER:-postgres}" --locale=C.UTF-8
    echo "host all all all trust" >> "$PGDATA/pg_hba.conf"
  fi
  if [ -n "$POSTGRES_DB" ] && [ "$POSTGRES_DB" != "${POSTGRES_USER:-postgres}" ]; then
    printf 'CREATE DATABASE "%s";\\n' "$POSTGRES_DB" | $PGBIN/postgres --single -D "$PGDATA" template1 >/dev/null
  fi
fi
exec $PGBIN/postgres -D "$PGDATA" -p "${PGPORT:-5432}" -c listen_addresses="${POSTGRES_LISTEN:-*}" -c unix_socket_directories=/tmp
"""]
base = "debian@13"

[dependencies]
postgresql17 = "17"

[volumes]
data = { path = "/var/lib/postgresql/data" }

[ports]
db = 5432

[health]
port = 5432
grace = "30s"

[restart]
policy = "on-failure"

[sources]
default = "https://registry.plybox.sh/ply/{package}"
