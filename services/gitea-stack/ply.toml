# gitea — self-hosted Git, as a ply stack: the app + its database, one file.
#   ply up
# gitea composes the git layer and connects to Postgres; on first boot it
# generates its config, migrates, and creates the admin from env. Change the
# passwords before anything real.
[stack]
gitea-db = { run = "postgres@17", env = { POSTGRES_PASSWORD = "change-me", POSTGRES_DB = "gitea" } }
gitea = { run = "gitea@1", after = "gitea-db", publish = "internal:3000", env = { DB_HOST = "gitea-db.ply:5432", DB_NAME = "gitea", DB_USER = "postgres", DB_PASSWD = "change-me", GITEA_ADMIN_USER = "admin", GITEA_ADMIN_PASSWORD = "change-me", GITEA_ADMIN_EMAIL = "admin@example.com" } }
