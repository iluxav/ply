# gitea — self-hosted git, as a ply keg: the gitea binary composed with the
# git layer (gitea shells out to git) and wired to Postgres in a stack.
[package]
name = "gitea"
version = "1.27.2"
user = "git:1000:1000"
entrypoint = ["./run.sh"]

include = ["gitea", "run.sh"]
base = "debian@13"

[dependencies]
git = "2.47"

[volumes]
data = { path = "/data" }

[ports]
http = 3000

[health]
port = 3000
grace = "60s"

[restart]
policy = "on-failure"

[sources]
default = "https://registry.plybox.sh/ply/{package}"
