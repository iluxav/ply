image = "/root/n8n.img"   # from: ply import docker://n8nio/n8n:latest
stack = "n8n"
after = ["n8n-db"]
publish = ["internal:5678"]
volumes = ["/data"]        # n8n's image declares no VOLUME; give it one
[env]
N8N_USER_FOLDER = "/data"
DB_TYPE = "postgresdb"
DB_POSTGRESDB_HOST = "n8n-db.ply"
DB_POSTGRESDB_PORT = "5432"
DB_POSTGRESDB_DATABASE = "n8n"
DB_POSTGRESDB_USER = "postgres"
DB_POSTGRESDB_PASSWORD = "change-me"
N8N_ENCRYPTION_KEY = "change-me-to-a-random-string"
N8N_SECURE_COOKIE = "false"
