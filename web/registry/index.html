<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ply registry</title>

    <meta name="description"
        content="The official ply package registry — content-addressed container images, append-only, served from a global CDN.">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="bg-ground text-ink font-mono antialiased">

    <div class="mx-auto w-full px-20">

        <!-- nav -->
        <header class="sticky top-0 z-10 bg-[#0c0f0df0] flex items-baseline justify-between py-4 border-b border-edge/50">
            <div class="flex items-baseline gap-1  justify-center  items-center">
                <a href="https://plybox.sh" class="text-lg tracking-tight logo">ply</a>
                <span class="text-sm tracking-tight accent opacity-[0.7]">box</span>
                <span class="text-sm tracking-tight accent opacity-[0.7]">/</span>
                <span class="text-sm tracking-tight">registry</span>
            </div>
            <nav class="flex gap-6 text-sm text-fade">
                <a href="https://plybox.sh" class="hover:text-accent">home</a>
                <a href="https://plybox.sh/docs/" class="hover:text-accent">docs</a>
                <a href="https://github.com/iluxav/ply" class="hover:text-accent">github</a>
            </nav>
        </header>

        <!-- stats -->
        <section class="pt-8 pb-8">
            <h1 class="text-3xl tracking-tight">packages</h1>
            <p id="stats" class="mt-3 text-sm text-fade"><!--stats--></p>
            <div class="mt-8 border border-edge bg-card px-4 py-3 max-w-xl">
                <pre class="overflow-x-auto text-sm leading-6"><code><span class="text-fade">[sources]</span>
default = <span class="text-accent">"https://registry.plybox.sh/ply/{package}"</span></code></pre>
            </div>
        </section>

        <!-- search + table -->
        <section class="pb-20">
            <div id="search-sentinel" class="h-px"></div>
            <input id="search" type="search" placeholder="/ filter packages…" autocomplete="off"
                class="sticky top-[14px] z-20 w-full max-w-md border border-edge bg-card px-4 py-2.5 text-sm placeholder:text-fade focus:border-accent focus:outline-none transition-[margin-left] duration-200">

            <div class="mt-6 overflow-x-auto border border-edge">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-edge text-left text-xs uppercase tracking-wider text-fade">
                            <th class="px-4 py-3 font-normal">package</th>
                            <th class="px-4 py-3 font-normal">versions</th>
                            <th class="px-4 py-3 font-normal">size</th>
                            <th class="px-4 py-3 font-normal">license</th>
                            <th class="px-4 py-3 font-normal">description</th>
                        </tr>
                    </thead>
                    <tbody id="rows"><!--rows--></tbody>
                </table>
            </div>
            <p id="empty" class="hidden mt-6 text-sm text-fade">no packages match.</p>
        </section>

        <footer class="border-t border-edge py-8 text-xs text-fade flex flex-wrap gap-x-6 gap-y-2">
            <span>content-addressed · append-only · any file host is a mirror</span>
            <a href="https://plybox.sh" class="hover:text-accent">plybox.sh</a>
        </footer>

    </div>

    <script>
        // The table is pre-rendered at publish time (web/render-registry.mjs);
        // this script only filters the rows that are already in the DOM.
        const search = document.getElementById("search");
        const rows = [...document.querySelectorAll("#rows tr")];

        function applyFilter() {
            const q = search.value.trim().toLowerCase();
            let shown = 0;
            for (const tr of rows) {
                const hit = !q || (tr.dataset.search ?? "").includes(q);
                tr.classList.toggle("hidden", !hit);
                if (hit) shown++;
            }
            document.getElementById("empty").classList.toggle("hidden", shown > 0);
        }

        document.getElementById("rows").addEventListener("click", (e) => {
            const b = e.target.closest(".copy-dep");
            if (!b) return;
            navigator.clipboard.writeText(b.dataset.dep).then(() => {
                b.textContent = "✓";
                setTimeout(() => { b.textContent = "copy"; }, 1200);
            });
        });

        search.addEventListener("input", applyFilter);
        document.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
        });

        // Dock the input beside the header logo only while it's actually
        // stuck: a sentinel above it leaves the viewport exactly when the
        // sticky engages (no native :stuck selector exists).
        new IntersectionObserver(([entry]) => {
            search.classList.toggle("md:ml-[183px]", !entry.isIntersecting);
        }, { rootMargin: "-15px 0px 0px 0px" }).observe(document.getElementById("search-sentinel"));
    </script>
</body>

</html>
